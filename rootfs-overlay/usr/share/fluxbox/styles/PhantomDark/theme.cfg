background: flat gradient vertical
background.color: #0b0d17
background.colorTo: #13182b

menu.frame.font: Adwaita Sans-10
menu.title.font: Adwaita Sans-10:bold
toolbar.clock.font: Adwaita Sans-10:bold
toolbar.workspace.font: Adwaita Sans-10:bold
toolbar.iconbar.focused.font: Adwaita Sans-9:bold
toolbar.iconbar.unfocused.font: Adwaita Sans-9
window.font: Adwaita Sans-10:bold

menu.bevelWidth: 6
menu.borderColor: #2e344e
menu.borderWidth: 1
menu.bullet: triangle
menu.bullet.position: Right
menu.roundCorners: TopLeft TopRight BottomLeft BottomRight
menu.title: flat
menu.title.justify: center
menu.title.color: #1f2336
menu.title.textColor: #89b4fa
menu.frame: flat
menu.frame.justify: left
menu.frame.color: #171a29
menu.frame.textColor: #e2e8f0
menu.frame.disableColor: #64748b
menu.hilite: flat
menu.hilite.color: #2b324e
menu.hilite.textColor: #ffffff

toolbar.visible: false
toolbar.bevelWidth: 0
toolbar.borderWidth: 0
toolbar.height: 28
toolbar: flat
toolbar.color: #141724

window.roundCorners: TopLeft TopRight BottomLeft BottomRight
window.bevelWidth: 6
window.borderWidth: 1
window.borderColor: #2c3148
window.justify: center
window.title.height: 36

window.title.focus: flat
window.title.focus.color: #1e2133
window.title.unfocus: flat
window.title.unfocus.color: #161826

window.label.focus: parentrelative
window.label.focus.textColor: #e2e8f0
window.label.unfocus: parentrelative
window.label.unfocus.textColor: #64748b

window.button.focus: parentrelative
window.button.focus.picColor: #e2e8f0
window.button.unfocus: parentrelative
window.button.unfocus.picColor: #64748b
window.button.pressed: parentrelative
window.button.pressed.picColor: #ffffff

window.close.pixmap: close.xpm
window.close.unfocus.pixmap: close_unfocus.xpm
window.close.pressed.pixmap: close_pressed.xpm

window.maximize.pixmap: max.xpm
window.maximize.unfocus.pixmap: max_unfocus.xpm
window.maximize.pressed.pixmap: max_pressed.xpm

window.iconify.pixmap: min.xpm
window.iconify.unfocus.pixmap: min_unfocus.xpm
window.iconify.pressed.pixmap: min_pressed.xpm

window.handle.focus: flat
window.handle.focus.color: #1e2133
window.handle.unfocus: flat
window.handle.unfocus.color: #161826
window.handleWidth: 0
