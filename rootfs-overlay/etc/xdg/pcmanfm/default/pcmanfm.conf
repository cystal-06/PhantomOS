[config]
bm_open_method=0

[volume]
mount_on_startup=1
mount_removable=1
autorun=1

[desktop]
wallpaper_mode=stretch
wallpaper=/usr/share/backgrounds/phantomos.png
desktop_bg=#0b0d17
desktop_fg=#e2e8f0
desktop_shadow=#000000
show_wm_menu=1
sort=mtime
show_documents=0
show_trash=0
show_mounts=0

[ui]
win_width=820
win_height=540
splitter_pos=190
side_pane_mode=1
view_mode=0
show_hidden=0
sort_type=0
sort_by=2
max_tab_chars=32
