[config]
bm_open_method=0

[volume]
mount_on_startup=1
mount_removable=1
autorun=1

[desktop]
wallpaper_mode=stretch
wallpaper=/usr/share/backgrounds/phantomos.png
desktop_bg=#181825
desktop_fg=#cdd6f4
desktop_shadow=#11111b
show_wm_menu=1
sort=mtime
show_documents=0
show_trash=1
show_mounts=1

[ui]
win_width=750
win_height=500
splitter_pos=180
side_pane_mode=1
view_mode=0
show_hidden=0
sort_type=0
sort_by=2
max_tab_chars=32
