Section "Device"
    Identifier "VirtioGPU"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "VirtioGPU"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x800" "1024x768"
    EndSubSection
EndSection
