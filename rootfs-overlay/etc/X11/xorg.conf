Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "VirtioGPU"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "PageFlip" "on"
    Option "DoubleShadow" "true"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "VirtioGPU"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080" "1600x900" "1280x800" "1024x768"
    EndSubSection
EndSection
